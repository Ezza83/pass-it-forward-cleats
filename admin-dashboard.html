
<!DOCTYPE html>

  <main class="container">

      Refresh Donations
    </button>

    <section id="donationsSection" hidden>
      <h2>Pending Donations</h2>
      <div id="donationsList"></div>
    </section>
<section id="requestsSection" hidden>
  <h2>Pending Cleat Requests</h2>
  <div id="requestsList"></div>
</section>
    <button id="logoutButton" type="button" hidden>
      Sign Out
    </button>

    <p><a href="index.html">Return to Home</a></p>
